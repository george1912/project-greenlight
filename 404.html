<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Find your study page · Project Green Light</title>
  <link rel="icon" href="/project-greenlight/favicon.svg?v=20261116-share" type="image/svg+xml">
  <link rel="stylesheet" href="/project-greenlight/styles.css?v=20261116-share">
  <script>
    // Recover a recognizable study link copied without its # marker.
    (() => {
      const base = '/project-greenlight/';
      if (!location.pathname.startsWith(base)) return;
      const page = location.pathname.slice(base.length).replace(/\/+$/, '');
      if (page !== 'final' && !page.startsWith('final/')) return;
      const target = new URL(base, location.origin);
      target.search = location.search;
      target.hash = '#/' + page;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="site-header"><a class="brand" href="/project-greenlight/">PROJECT GREEN LIGHT</a></header>
    <main class="hero">
      <p class="eyebrow">A SMALL DETOUR</p>
      <h1>Let’s find your<br><span>study page.</span></h1>
      <p class="hero-copy">This link is unavailable. Choose a topic from the study guide.</p>
      <a class="text-link" href="/project-greenlight/#/final/study-guide">Open the final exam study guide →</a>
    </main>
  </div>
</body>
</html>

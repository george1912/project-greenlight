name: Publish Project Green Light

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-greenlight-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html app.js content.js styles.css favicon.svg .nojekyll _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

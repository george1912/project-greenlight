name: Publish Project Green Light

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-greenlight-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node for study articles
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html 404.html app.js analytics.js ob-content.js ob-objectives.js ob-readability-data.js ob-readability.js ob-presentations.js ob.js ob-practice-data.js ob-practice.js quiz-review.js focused-review.js focused-review-data.js focused-review-olivia-data.js focused-review-combined-data.js content.js conditions.js presentations.js viewer.js videos.js ob-videos.js video-library.js podcast.js quiz-data.js quiz.js presentation-quiz-data.js presentation-quizzes.js posters.js section-quizzes.js styles.css favicon.svg .nojekyll _site/
          cp -R presentations posters practice-questions resources assets _site/
          cp -R ob-presentations _site/
          cp ob-posters.js ob-question-map.js ob-question-quizzes.js _site/
          cp -R ob-practice-questions _site/
          cp study-reader.js _site/
          node scripts/prepare-study-reader.cjs _site
      - name: Check study articles
        run: node scripts/check-study-reader.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
